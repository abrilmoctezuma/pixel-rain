<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pixel Rain</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: grid;
      place-items: center;
      background: #0a0a1a;
      color: #fff;
      font-family: Verdana, sans-serif;
    }
    #caja { position: relative; width: 800px; height: 600px; }
    #espera {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      background: rgba(10, 10, 26, .95);
    }
    #espera h1 { margin: 0; font-size: 34px; }
    #espera p { margin: 0; opacity: .8; }
    #qr { background: #fff; padding: 12px; border-radius: 8px; min-width: 200px; min-height: 200px; }
    #url { font-size: 14px; opacity: .7; max-width: 700px; word-break: break-all; }
    .estado { font-size: 20px; font-weight: bold; }
    #j0 { color: #2ec4b6; }
    #j1 { color: #ff6b35; }
  </style>
</head>
<body>
  <div id="caja">
    <div id="espera">
      <h1>Pixel Rain</h1>
      <p id="aviso">Creando sala…</p>
      <div id="qr"></div>
      <div id="url"></div>
      <div class="estado" id="j0"></div>
      <div class="estado" id="j1"></div>
    </div>
    <div id="juego"></div>
  </div>

  <!-- Phaser desde internet: así solo subes index.html y control.html -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const W = 800, H = 600, TIEMPO = 60;
    const COLORES = [0x2ec4b6, 0xff6b35];
    const CSS = ['#2ec4b6', '#ff6b35'];

    let estado = 'esperando';          // esperando | cuenta | jugando | fin
    const conns = [null, null];        // conexión de cada celular
    const conectados = [false, false];
    let escena = null;
    const espera = document.getElementById('espera');
    const aviso = document.getElementById('aviso');

    function pintarEstado() {
      [0, 1].forEach((i) => {
        const el = document.getElementById('j' + i);
        el.textContent = 'Jugador ' + (i + 1) + ': ' + (conectados[i] ? 'listo ✔' : 'esperando…');
        el.style.opacity = conectados[i] ? 1 : 0.5;
      });
    }
    pintarEstado();

    // Manda un mensaje a los dos celulares
    function enviarATodos(msg) {
      conns.forEach((c) => { if (c && c.open) c.send(msg); });
    }

    function revisar() {
      if (estado === 'esperando' && conectados[0] && conectados[1] && escena && escena.jug) {
        escena.iniciar();
      }
    }

    // ---------- Sala con PeerJS ----------
    function crearSala() {
      const id = 'esq-' + Math.random().toString(36).slice(2, 7);
      const peer = new Peer(id);

      peer.on('open', (idSala) => {
        const url = new URL('control.html?sala=' + idSala, location.href).href;
        const qr = document.getElementById('qr');
        qr.innerHTML = '';
        new QRCode(qr, { text: url, width: 200, height: 200 });
        document.getElementById('url').textContent = url;
        aviso.textContent = 'Escanea el QR con tu celular';
      });

      peer.on('connection', alUnirse);
      peer.on('disconnected', () => peer.reconnect());
      peer.on('error', (e) => {
        if (e.type === 'unavailable-id') crearSala();   // código repetido: probamos otro
        else aviso.textContent = 'Error de conexión (' + e.type + '). Recarga la página.';
      });
    }

    function alUnirse(conn) {
      conn.on('open', () => {
        const i = conns.indexOf(null);
        if (i === -1) {
          conn.send({ t: 'lleno' });
          setTimeout(() => conn.close(), 300);
          return;
        }
        conns[i] = conn;
        conn.slot = i;
        conectados[i] = true;
        conn.send({ t: 'asignado', slot: i });
        pintarEstado();
        revisar();
      });

      conn.on('data', (m) => {
        if (conn.slot === undefined) return;
        if (m.t === 'mover' && escena && escena.jug) {
          escena.jug[conn.slot].dir = Math.sign(m.dir) || 0;
        } else if (m.t === 'otravez' && estado === 'fin' && escena) {
          escena.iniciar();
        }
      });

      const salir = () => {
        const s = conn.slot;
        if (s === undefined || conns[s] !== conn) return;
        conns[s] = null;
        conectados[s] = false;
        pintarEstado();
        if (estado !== 'esperando') {
          estado = 'esperando';
          espera.style.display = 'flex';
          if (escena) escena.reiniciar();
        }
      };
      conn.on('close', salir);
      conn.on('error', salir);
    }

    crearSala();

    // ---------- Phaser ----------
    class Escena extends Phaser.Scene {
      create() {
        this.cameras.main.setBackgroundColor('#14143a');

        // Jugadores
        this.jug = [0, 1].map((i) => {
          const p = this.add.rectangle(i ? 600 : 200, H - 40, 90, 28, COLORES[i]);
          this.physics.add.existing(p);
          p.body.setCollideWorldBounds(true);
          p.dir = 0;
          p.puntos = 0;
          return p;
        });

        // Objetos que caen
        this.objetos = this.physics.add.group();
        this.jug.forEach((p) => {
          this.physics.add.overlap(p, this.objetos, (jugador, o) => {
            if (estado !== 'jugando') return;
            jugador.puntos += o.esBomba ? -1 : 1;
            o.destroy();
            this.actualizarMarcador();
          });
        });

        // Textos
        const estilo = (color) => ({ fontFamily: 'Verdana', fontSize: '28px', fontStyle: 'bold', color });
        this.t = [0, 1].map((i) =>
          this.add.text(i ? W - 20 : 20, 16, '', estilo(CSS[i])).setOrigin(i, 0)
        );
        this.reloj = this.add.text(W / 2, 16, '', estilo('#ffffff')).setOrigin(0.5, 0);
        this.msg = this.add
          .text(W / 2, H / 2, '', { ...estilo('#ffffff'), fontSize: '56px', align: 'center' })
          .setOrigin(0.5)
          .setDepth(5);

        // Generador de objetos
        this.time.addEvent({ delay: 650, loop: true, callback: this.crearObjeto, callbackScope: this });

        // Barra espaciadora = jugar de nuevo (por si no quieres usar el celular)
        this.input.keyboard.on('keydown-SPACE', () => {
          if (estado === 'fin') this.iniciar();
        });

        this.actualizarMarcador();
        escena = this;
        revisar();
      }

      limpiar() {
        [...this.objetos.getChildren()].forEach((o) => o.destroy());
      }

      reiniciar() {
        this.limpiar();
        this.jug.forEach((p) => { p.puntos = 0; p.dir = 0; });
        this.msg.setText('');
        this.reloj.setText('');
        this.actualizarMarcador();
      }

      iniciar() {
        this.reiniciar();
        estado = 'cuenta';
        espera.style.display = 'none';
        enviarATodos({ t: 'inicio' });

        let n = 3;
        this.msg.setText(String(n));
        this.time.addEvent({
          delay: 1000,
          repeat: 2,
          callback: () => {
            n--;
            if (n > 0) {
              this.msg.setText(String(n));
            } else {
              this.msg.setText('¡YA!');
              estado = 'jugando';
              this.inicio = this.time.now;
              this.time.delayedCall(700, () => { if (estado === 'jugando') this.msg.setText(''); });
            }
          },
        });
      }

      crearObjeto() {
        if (estado !== 'jugando') return;
        const t = (this.time.now - this.inicio) / 1000;   // segundos jugados
        const bomba = Math.random() < 0.3;
        const x = Phaser.Math.Between(30, W - 30);

        const o = bomba
          ? this.add.circle(x, -20, 16, 0x3d0c11).setStrokeStyle(4, 0xff3b3b)
          : this.add.circle(x, -20, 14, 0xffd23f).setStrokeStyle(3, 0xffffff);

        this.physics.add.existing(o);
        this.objetos.add(o);
        // La velocidad va DESPUÉS de agregarlo al grupo y aumenta con el tiempo
        o.body.setVelocityY(Phaser.Math.Between(150, 260) + t * 3);
        o.esBomba = bomba;
      }

      actualizarMarcador() {
        this.jug.forEach((p, i) => this.t[i].setText('J' + (i + 1) + ': ' + p.puntos));
      }

      terminar() {
        estado = 'fin';
        this.limpiar();
        this.reloj.setText('0');
        const [a, b] = [this.jug[0].puntos, this.jug[1].puntos];
        const ganador = a === b ? '¡Empate!' : '¡Gana el Jugador ' + (a > b ? 1 : 2) + '!';
        this.msg.setText(ganador + '\n' + a + ' – ' + b);
        enviarATodos({ t: 'fin' });
      }

      update() {
        if (estado === 'jugando') {
          this.jug.forEach((p) => p.body.setVelocityX(p.dir * 420));

          const restante = Math.max(0, TIEMPO - (this.time.now - this.inicio) / 1000);
          this.reloj.setText(String(Math.ceil(restante)));
          if (restante <= 0) this.terminar();
        } else {
          this.jug.forEach((p) => p.body.setVelocityX(0));
        }

        // Borrar lo que ya salió de la pantalla
        [...this.objetos.getChildren()].forEach((o) => { if (o.y > H + 30) o.destroy(); });
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      width: W,
      height: H,
      parent: 'juego',
      physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
      scene: Escena,
    });
  </script>
</body>
</html>
