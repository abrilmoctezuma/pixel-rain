<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pixel Rain – Control</title>
  <style>
    :root { --c: #555; }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f0f24;
      color: #fff;
      font-family: Verdana, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #app { display: flex; flex-direction: column; height: 100%; }
    #info {
      padding: 18px 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      background: var(--c);
      color: #0f0f24;
    }
    #otra {
      display: none;
      margin: 12px 12px 0;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: 3px solid var(--c);
      border-radius: 16px;
      background: transparent;
      color: var(--c);
    }
    #botones { flex: 1; display: none; gap: 12px; padding: 12px; }
    .flecha {
      flex: 1;
      border: 0;
      border-radius: 28px;
      background: var(--c);
      color: #0f0f24;
      font-size: min(30vw, 30vh);
      line-height: 1;
      transition: transform .06s, filter .06s;
    }
    .flecha.on { transform: scale(.96); filter: brightness(1.3); }
  </style>
</head>
<body>
  <div id="app">
    <div id="info">Conectando…</div>
    <button id="otra">Jugar de nuevo</button>
    <div id="botones">
      <button class="flecha" id="izq">◀</button>
      <button class="flecha" id="der">▶</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const info = document.getElementById('info');
    const botones = document.getElementById('botones');
    const otra = document.getElementById('otra');
    const COLORES = ['#2ec4b6', '#ff6b35'];
    const apretado = { izq: false, der: false };

    // El código de la sala viene en la URL del QR: control.html?sala=esq-xxxxx
    const sala = new URLSearchParams(location.search).get('sala');
    let peer = null;
    let conn = null;

    function perdida(texto) {
      info.textContent = texto;
      botones.style.display = 'none';
      otra.style.display = 'none';
    }

    function alRecibir(m) {
      if (m.t === 'asignado') {
        document.documentElement.style.setProperty('--c', COLORES[m.slot]);
        info.textContent = 'Eres el Jugador ' + (m.slot + 1);
        botones.style.display = 'flex';
      } else if (m.t === 'lleno') {
        perdida('La partida ya tiene 2 jugadores');
      } else if (m.t === 'fin') {
        otra.style.display = 'block';
      } else if (m.t === 'inicio') {
        otra.style.display = 'none';
      }
    }

    function conectar() {
      info.textContent = 'Conectando…';
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(sala, { reliable: true });
        conn.on('data', alRecibir);
        conn.on('close', () => perdida('Se perdió la conexión. Recarga la página.'));
        conn.on('error', () => perdida('Error de conexión. Recarga la página.'));
      });

      peer.on('error', (e) => {
        perdida('No se pudo conectar (' + e.type + '). Revisa que la pantalla principal siga abierta y recarga.');
      });
    }

    if (!sala) {
      info.textContent = 'Escanea el QR de la pantalla principal';
    } else {
      conectar();
    }

    otra.addEventListener('click', () => {
      otra.style.display = 'none';
      if (conn && conn.open) conn.send({ t: 'otravez' });
    });

    function enviar() {
      const dir = (apretado.der ? 1 : 0) - (apretado.izq ? 1 : 0);
      if (conn && conn.open) conn.send({ t: 'mover', dir });
    }

    ['izq', 'der'].forEach((nombre) => {
      const b = document.getElementById(nombre);

      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        apretado[nombre] = true;
        b.classList.add('on');
        enviar();
        if (navigator.vibrate) navigator.vibrate(10);
      });

      const soltar = () => {
        apretado[nombre] = false;
        b.classList.remove('on');
        enviar();
      };
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, soltar));
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
